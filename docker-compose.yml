services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vynno
      POSTGRES_PASSWORD: vynno
      POSTGRES_DB: vynno
    ports:
      # Host 5433: 5432 is often already taken by another local Postgres.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vynno -d vynno"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
