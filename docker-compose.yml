services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vynno
      POSTGRES_PASSWORD: vynno
      POSTGRES_DB: vynno
    ports:
      # Host 5433: 5432 is often already taken by another local Postgres.
      # Loopback only: a bare "5433:5432" publishes on every interface (Docker
      # bypasses the host firewall), exposing the database to the LAN.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vynno -d vynno"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.31
    # Loopback only: the UI shows every one-time code, including password resets.
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
