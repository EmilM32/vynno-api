version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A new Postgres major cannot start on the pgdata volume of the old one: it
      # is a planned move (scripts/backup, new volume, scripts/restore), not a PR.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
