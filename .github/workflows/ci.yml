name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vynno
          POSTGRES_PASSWORD: vynno
          POSTGRES_DB: vynno
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vynno -d vynno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://vynno:vynno@localhost:5432/vynno?sslmode=disable
      # Store and service tests create and drop their own vynno_test_* databases on this server.
      TEST_DATABASE_URL: postgres://vynno:vynno@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: Test
        run: go test -race ./...
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
