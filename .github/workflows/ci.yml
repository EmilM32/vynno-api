name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vynno
          POSTGRES_PASSWORD: vynno
          POSTGRES_DB: vynno
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vynno -d vynno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://vynno:vynno@localhost:5432/vynno?sslmode=disable
      # Store and service tests create and drop their own vynno_test_* databases on this server.
      TEST_DATABASE_URL: postgres://vynno:vynno@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.12.2
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: Test
        run: go test -race ./...
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
