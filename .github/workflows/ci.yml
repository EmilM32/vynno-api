name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vynno
          POSTGRES_PASSWORD: vynno
          POSTGRES_DB: vynno
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vynno -d vynno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://vynno:vynno@localhost:5432/vynno?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
      - name: Test
        run: go test ./...
